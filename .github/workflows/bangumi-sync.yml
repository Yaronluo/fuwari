name: 自动同步追番数据

# 触发条件
on:
  schedule:
    # 每天北京时间凌晨 4 点自动执行 (UTC 时间 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上直接手动点按钮触发

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Cloudflare Pages 构建
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/c60a5cc3-5002-46e3-be7d-a4d82d8ffc85"
